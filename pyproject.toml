[project]
name = "jalkavach"
version = "0.1.0"
description = "Early warning and ingress localisation for contamination in intermittent urban water networks"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tushar Agarwal", email = "tusharaggarwal274@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "indic-transliteration>=2.3.83",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "opencv-contrib-python-headless>=5.1.0.95",
    "osmnx>=2.2.0",
    "pandas>=3.1.1",
    "pydeck>=0.9.3",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "six>=1.17.0",
    "streamlit>=1.67.0",
    "wntr>=1.5.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
